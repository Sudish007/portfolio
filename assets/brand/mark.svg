<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" role="img" aria-label="Sudish Kumar — SK synapse mark">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="14" y1="18" x2="90" y2="84">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="bg" cx=".28" cy=".18" r="1.1">
      <stop offset="0" stop-color="#151b33"/>
      <stop offset="1" stop-color="#07070d"/>
    </radialGradient>
    <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0V10" fill="none" stroke="#ffffff" stroke-opacity=".055" stroke-width=".6"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#bg)"/>
  <rect width="100" height="100" rx="24" fill="url(#grid)"/>
  <!-- orbit: trajectory / time -->
  <circle cx="50" cy="50" r="41.5" fill="none" stroke="url(#g)" stroke-opacity=".38" stroke-width=".9" stroke-dasharray="1.6 4.2"/>
  <!-- letterforms as circuit traces -->
  <g fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M45 31C40 22 20 24 21 37C22 49 46 46 45 60C44 73 23 74 18 65"/>
    <path d="M61 26V74M61 50L83 27M61 50L85 74"/>
  </g>
  <!-- nodes -->
  <g fill="url(#g)">
    <circle cx="45" cy="31" r="5.2"/><circle cx="18" cy="65" r="5.2"/>
    <circle cx="61" cy="26" r="5.2"/><circle cx="61" cy="74" r="5.2"/><circle cx="83" cy="27" r="5.2"/><circle cx="85" cy="74" r="5.2"/>
  </g>
  <!-- the spark: one warm, human point in the graph -->
  <circle cx="61" cy="50" r="9" fill="#f59e0b" fill-opacity=".28"/>
  <circle cx="61" cy="50" r="6.4" fill="#f59e0b"/>
  <circle cx="61" cy="50" r="2.9" fill="#fff7ed"/>
</svg>
