img.onload = function() {
    // Background
    ctx.fillStyle = '#0a0a0f';
    ctx.fillRect(0, 0, 1200, 630);

    // Gradient bars top & bottom
    const grad = ctx.createLinearGradient(0, 0, 1200, 0);
    grad.addColorStop(0, '#06b6d4');
    grad.addColorStop(1, '#8b5cf6');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 1200, 5);
    ctx.fillRect(0, 625, 1200, 5);

    // Circular photo - CENTERED and large
    const px=600, py=220, pr=100;
    ctx.save();
    ctx.beginPath();
    ctx.arc(px, py, pr, 0, Math.PI*2);
    ctx.clip();
    ctx.drawImage(img, px-pr, py-pr-25, pr*2, pr*2+50);
    ctx.restore();
    // Border
    ctx.beginPath();
    ctx.arc(px, py, pr+3, 0, Math.PI*2);
    ctx.strokeStyle='#06b6d4';
    ctx.lineWidth=4;
    ctx.stroke();
    // Glow
    ctx.beginPath();
    ctx.arc(px, py, pr+9, 0, Math.PI*2);
    ctx.strokeStyle='rgba(6,182,212,0.25)';
    ctx.lineWidth=3;
    ctx.stroke();

    // Name - centered below photo
    ctx.textAlign='center';
    ctx.font='900 56px sans-serif';
    ctx.fillStyle='#f0f0f5';
    ctx.fillText('SUDISH KUMAR', 600, 380);

    // Subtitle
    ctx.font='500 22px monospace';
    ctx.fillStyle='#06b6d4';
    ctx.fillText('ML Engineer | Deep Learning | GenAI | AWS SageMaker', 600, 420);

    // Stats line
    ctx.font='400 18px sans-serif';
    ctx.fillStyle='#a0a0b0';
    ctx.fillText('2+ Yrs Amazon/AWS  \u2022  99%+ Accuracy  \u2022  2 AWS Certs  \u2022  Open to Roles', 600, 470);

    // Badge
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(420, 510, 360, 46, 23);
    ctx.fill();
    ctx.font='700 17px sans-serif';
    ctx.fillStyle='#fff';
    ctx.fillText('\uD83D\uDD25 Hire Me for AI/ML Engineering', 600, 539);

    ctx.textAlign='left';

    // Download
    const link=document.createElement('a');
    link.download='og-image.png';
    link.href=c.toDataURL('image/png');
    link.textContent='Download og-image.png';
    link.style='display:block;margin:20px;color:#06b6d4;font-size:22px;font-family:sans-serif';
    document.body.appendChild(link);
    document.getElementById('status').textContent='Done! Click below to download.';
};
